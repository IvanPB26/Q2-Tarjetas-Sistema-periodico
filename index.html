<style>
:root{--g:#1B5E20;--g2:#2E7D32;--gl:#E8F2E9;--gm:#C8E6C9;--r:#B71C1C;--rl:#FDECEA;--y:#FFF3CD;--yb:#E0B33A;--b:#1F4E8C;--bl:#E7EFFA;--ink:#1d2321;--mut:#5d6b63;--bg:#F4F7F4;--card:#fff;--fs:17px;--lh:1.5;--font:Inter,system-ui,sans-serif}
body.easy{--fs:20px;--lh:1.75;--font:Lexend,Inter,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--bg)}
body{font-family:var(--font);font-size:var(--fs);line-height:var(--lh);color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
body.easy{letter-spacing:.01em;word-spacing:.06em}
header{background:var(--g);color:#fff;padding:14px 16px 0}
.top{max-width:760px;margin:0 auto}
.brand{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 12px 4px 6px;font-size:13px;font-weight:600}
.brand svg{flex:none}
h1{font-size:22px;line-height:1.2;margin:10px 0 2px;font-weight:800}
.sub{opacity:.85;font-size:14px;margin-bottom:10px}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav button{flex:1 0 auto;border:0;background:transparent;color:#fff;opacity:.75;font:inherit;font-size:15px;font-weight:700;padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{opacity:1;border-bottom-color:#FFD54F}
main{max-width:760px;margin:0 auto;padding:14px 16px 40px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
select,.chk{font:inherit;font-size:15px;border:1px solid #c9d6cb;border-radius:10px;background:#fff;padding:7px 10px;color:var(--ink)}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.chk input{width:18px;height:18px;accent-color:var(--g2)}
.prog{background:#fff;border:1px solid #dbe5dc;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.boxes{display:flex;gap:4px;margin-top:6px}
.boxes div{flex:1;text-align:center;border-radius:6px;padding:4px 0;font-weight:700;font-size:13px}
.lbl{display:flex;justify-content:space-between;color:var(--mut);font-size:12.5px;margin-top:4px}
.card{background:var(--card);border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.08);border:1px solid #dbe5dc;padding:18px;min-height:240px;position:relative}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--gl);color:var(--g)}
.chip.ex{background:var(--y);color:#7a5a00;border:1px solid var(--yb)}
.q{font-size:1.15em;font-weight:700;line-height:1.35}
.a{margin-top:14px;padding-top:14px;border-top:2px dashed var(--gm)}
.a img,.step img{display:block;max-width:100%;height:auto;margin:12px auto 0;border-radius:10px;border:1px solid #e3eae4}
.hint{color:var(--mut);font-size:14px;margin-top:14px;text-align:center}
.btns{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;font:inherit;font-weight:800;font-size:16px;border:0;border-radius:12px;padding:14px 10px;cursor:pointer;touch-action:manipulation}
.btn.show{background:var(--g2);color:#fff}
.btn.no{background:var(--rl);color:var(--r);border:2px solid #efb3ad}
.btn.si{background:var(--gl);color:var(--g);border:2px solid #9ccc9f}
.btn.ghost{background:#fff;color:var(--g);border:2px solid var(--gm)}
.btn:focus-visible,nav button:focus-visible,select:focus-visible{outline:3px solid #FFB300;outline-offset:2px}
.mf{font-size:2.2em;font-weight:800;color:var(--g);text-align:center;line-height:1.1;margin-top:6px}
.mn{text-align:center;color:var(--mut);margin-bottom:6px}
.mz{text-align:center;font-size:14px;color:var(--mut)}
.task{background:var(--gl);border-radius:12px;padding:10px 12px;margin:12px 0;font-size:.92em}
.step{border:1px solid #dbe5dc;border-radius:12px;margin-top:10px;overflow:hidden}
.step h3{margin:0;font-size:15px;padding:9px 12px;background:#f7faf7;display:flex;align-items:center;gap:8px}
.step h3 .n{background:var(--g2);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-grid;place-items:center;font-size:13px;flex:none}
.step .c{padding:10px 12px}
.step.locked h3{color:var(--mut)}
.step.locked .n{background:#9aa79d}
.note{margin-top:10px;background:var(--y);border:1px solid var(--yb);border-radius:10px;padding:8px 10px;font-size:.92em}
.vf{font-size:1.15em;font-weight:700;line-height:1.4;text-align:center;padding:18px 4px}
.fb{margin-top:12px;border-radius:12px;padding:12px;font-size:.98em}
.fb.ok{background:var(--gl);border:2px solid #9ccc9f}
.fb.ko{background:var(--rl);border:2px solid #efb3ad}
.fb b.t{display:block;font-size:1.05em;margin-bottom:4px}
.done{text-align:center;padding:30px 10px}
.done .big{font-size:42px}
.help h2{font-size:18px;color:var(--g);margin:18px 0 6px}
.help p,.help li{color:#2d3631}
footer{text-align:center;color:var(--mut);font-size:12.5px;padding:10px 16px 30px}
@media (max-width:480px){h1{font-size:19px}.card{padding:14px}.mf{font-size:1.9em}}
</style>
</head>

<script>
const DATA={"meta": {"curso": "Química 2.º Bachillerato", "unidad": 2, "titulo": "Sistema periódico", "clave": "u2", "repo": "Q2-Tarjetas-Sistema-periodico", "url": "https://ivanpb26.github.io/Q2-Tarjetas-Sistema-periodico/", "modo2": {"tab": "Elementos", "titulo": "Elemento sorpresa", "chip": "★ Tipo PAU", "tarea": "Hazlo tú primero: <b>configuración → periodo, grupo y bloque → Z<sub>ef</sub> → ion más probable → compara</b>. Después destapa cada paso.", "ayuda": "elementos como los de la PAU, dados por su número atómico. Haz tú los 5 pasos (configuración; periodo, grupo y bloque; Z<sub>ef</sub> ≈ Z − electrones internos; ion más probable; comparar una propiedad con otro elemento usando solo n y Z<sub>ef</sub>) y destápalos uno a uno.", "print_hint": "configuración → periodo/grupo/bloque → Zef → ion → compara (n y Zef)"}}, "blocks": ["Historia de la tabla periódica", "De la configuración a la posición", "Carga nuclear efectiva", "Radio atómico", "Radio iónico e isoelectrónicos", "Energía de ionización", "Afinidad electrónica", "Electronegatividad y resumen"], "cards": [{"id": "c0_0", "b": 0, "q": "¿Qué aportó Döbereiner (1827)?", "a": "Clasificó los elementos en <b>triadas</b>: grupos de tres elementos con propiedades semejantes (Li, Na, K · Ca, Sr, Ba · S, Se, Te).", "img": null, "ex": 0, "e": 0}, {"id": "c0_1", "b": 0, "q": "¿Qué es la ley de las octavas de Newlands (1864)?", "a": "Ordenó los elementos por <b>masa atómica creciente</b> y vio que el <b>octavo</b> se parecía al primero, como las octavas musicales.", "img": null, "ex": 0, "e": 0}, {"id": "c0_2", "b": 0, "q": "¿Qué hizo Mendeléiev en 1869?", "a": "Enunció la <b>ley periódica</b> y publicó la primera tabla: grupos (columnas) y periodos (filas) de propiedades semejantes. <b>Dejó huecos</b> y predijo elementos (el eka-silicio = germanio) e <b>invirtió</b> el orden de masas cuando las propiedades lo exigían (Te antes que I).", "img": null, "ex": 0, "e": 1}, {"id": "c0_3", "b": 0, "q": "¿Qué demostró Moseley (1913)?", "a": "Con los espectros de <b>rayos X</b> demostró que la tabla se ordena por el <b>número atómico Z</b>, no por la masa. Así se explican las inversiones Te/I y Ar/K.", "img": null, "ex": 0, "e": 1}, {"id": "c0_4", "b": 0, "q": "¿Qué aportó Bohr (1922) y cómo es la tabla actual?", "a": "Ordenó por <b>Z</b> y explicó la tabla con la <b>configuración electrónica</b> (capas). Hoy: <b>118 elementos</b>, <b>7 periodos</b> y <b>18 grupos</b>.", "img": null, "ex": 0, "e": 1}, {"id": "c0_5", "b": 0, "q": "¿Por qué los elementos de un mismo grupo tienen propiedades semejantes?", "a": "Porque tienen el <b>mismo número de electrones de valencia</b> (la misma configuración en la última capa).", "img": null, "ex": 1, "e": 1}, {"id": "c1_0", "b": 1, "q": "¿Cómo se sabe el periodo de un elemento a partir de su configuración?", "a": "El periodo es el <b>nivel n más alto ocupado</b>.", "img": null, "ex": 1, "e": 1}, {"id": "c1_1", "b": 1, "q": "¿Qué es el bloque de un elemento y cuáles hay?", "a": "El tipo de orbital que ocupa el <b>electrón diferenciador</b>: <b>s, p, d o f</b>.<br>s + p: <b>representativos</b> · d: <b>transición</b> · f: <b>transición interna</b> (lantánidos 4f, actínidos 5f).", "img": "bloques", "ex": 1, "e": 1}, {"id": "c1_2", "b": 1, "q": "¿Cómo se calcula el grupo en los bloques s, p y d?", "a": "Bloque <b>s</b> (ns¹⁻²): grupo = e⁻ en ns.<br>Bloque <b>p</b> (ns² np¹⁻⁶): grupo = <b>12 + e⁻ en np</b>.<br>Bloque <b>d</b> ((n−1)d ns²): grupo = e⁻ en ns + e⁻ en (n−1)d.", "img": null, "ex": 1, "e": 1}, {"id": "c1_3", "b": 1, "q": "Nombres de los grupos 1, 2, 13, 14, 15, 16, 17 y 18.", "a": "1 alcalinos · 2 alcalinotérreos · 13 térreos · 14 carbonoideos · 15 nitrogenoideos · 16 calcógenos (anfígenos) · 17 halógenos · 18 gases nobles.", "img": null, "ex": 0, "e": 1}, {"id": "c1_4", "b": 1, "q": "¿Qué elemento es [Ar] 3d¹⁰ 4s² 4p⁵? Periodo, grupo y bloque.", "a": "n más alto = 4 → <b>periodo 4</b>; último e⁻ en p → <b>bloque p</b>; grupo 12 + 5 = <b>17</b> (halógenos) → <b>Br</b>.", "img": null, "ex": 1, "e": 1}, {"id": "c1_5", "b": 1, "q": "Periodo, grupo y bloque del elemento Z = 34.", "a": "1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d¹⁰ 4p⁴ → <b>periodo 4</b>, <b>bloque p</b>, grupo 12 + 4 = <b>16</b> (calcógenos): es el <b>Se</b>.", "img": null, "ex": 1, "e": 1}, {"id": "c1_6", "b": 1, "q": "¿Qué elemento es [Ar] 3d⁶ 4s²?", "a": "Periodo 4, <b>bloque d</b>, grupo 6 + 2 = <b>8</b> → <b>Fe</b>.", "img": null, "ex": 0, "e": 0}, {"id": "c1_7", "b": 1, "q": "Periodo, grupo y bloque del elemento cuya configuración termina en 5s² 4d¹.", "a": "<b>Periodo 5</b>, <b>bloque d</b>, grupo 2 + 1 = <b>3</b> → itrio (Y).", "img": null, "ex": 0, "e": 0}, {"id": "c1_8", "b": 1, "q": "¿Qué configuraciones excepcionales hay que conocer?", "a": "<b>Cr</b>: [Ar] 4s¹ 3d⁵ · <b>Cu</b>: [Ar] 4s¹ 3d¹⁰ · <b>Ag</b>: [Kr] 5s¹ 4d¹⁰.<br>La subcapa d <b>semillena o llena</b> es más estable.", "img": null, "ex": 0, "e": 0}, {"id": "c1_9", "b": 1, "q": "¿Qué es la valencia iónica?", "a": "La <b>carga del ion</b> que da al átomo la configuración del <b>gas noble</b> más cercano (ns² np⁶).<br>Grupo 1: M⁺ · 2: M²⁺ · 13: M³⁺ · 15: X³⁻ · 16: X²⁻ · 17: X⁻ · 18: no forman iones.", "img": null, "ex": 1, "e": 1}, {"id": "c1_10", "b": 1, "q": "Ion más probable y valencia iónica del Sr (Z = 38) y del Br (Z = 35).", "a": "Sr: [Kr] 5s² → pierde 2 e⁻ → <b>Sr²⁺</b>, valencia <b>+2</b>.<br>Br: [Ar] 3d¹⁰ 4s² 4p⁵ → gana 1 e⁻ → <b>Br⁻</b>, valencia <b>−1</b>.", "img": null, "ex": 1, "e": 1}, {"id": "c2_0", "b": 2, "q": "¿Qué es la carga nuclear efectiva (Z<sub>ef</sub>)?", "a": "La <b>carga neta positiva</b> que siente un electrón externo: los electrones internos lo <b>apantallan</b>.<br>Z<sub>ef</sub> = Z − S (S = constante de apantallamiento). A mayor Z<sub>ef</sub>, más atraído está el electrón.", "img": null, "ex": 1, "e": 1}, {"id": "c2_1", "b": 2, "q": "¿Qué aproximación usamos para calcular Z<sub>ef</sub>? Ejemplos.", "a": "<b>S ≈ número de electrones internos</b>.<br>Na (1s² 2s² 2p⁶ 3s¹): Z<sub>ef</sub> ≈ 11 − 10 = <b>1</b>.<br>Cl (1s² 2s² 2p⁶ 3s² 3p⁵): Z<sub>ef</sub> ≈ 17 − 10 = <b>7</b>.", "img": null, "ex": 1, "e": 1}, {"id": "c2_2", "b": 2, "q": "¿Cuál es la «regla de oro» de la unidad?", "a": "Toda propiedad periódica se justifica con la <b>estructura del átomo</b> (nivel <b>n</b>, <b>Z<sub>ef</sub></b>, distancia al núcleo), <b>nunca solo con la posición</b> en la tabla.", "img": null, "ex": 1, "e": 1}, {"id": "c2_3", "b": 2, "q": "¿Cómo varían n y Z<sub>ef</sub> en un periodo y en un grupo?", "a": "En un <b>periodo</b> (→): n <b>constante</b>, Z<sub>ef</sub> <b>aumenta</b>.<br>En un <b>grupo</b> (↓): n <b>aumenta</b>, Z<sub>ef</sub> <b>casi constante</b>.", "img": null, "ex": 1, "e": 1}, {"id": "c2_4", "b": 2, "q": "¿Cuánto vale la Z<sub>ef</sub> del galio (Z = 31)?", "a": "Ga: [Ar] 3d¹⁰ 4s² 4p¹. Electrones internos: 18 + 10 = 28 (los 3d¹⁰ también son internos).<br>Z<sub>ef</sub> ≈ 31 − 28 = <b>3</b>.", "img": null, "ex": 0, "e": 0}, {"id": "c3_0", "b": 3, "q": "¿Qué es el radio atómico y por qué no se mide directamente?", "a": "La distancia del núcleo al <b>electrón más externo</b>. Los orbitales no tienen límites definidos, así que se <b>estima</b> en átomos enlazados (pm o Å).", "img": null, "ex": 0, "e": 0}, {"id": "c3_1", "b": 3, "q": "¿Cómo varía el radio atómico en un grupo? Justifícalo.", "a": "<b>Aumenta hacia abajo</b>: se ocupan <b>niveles n mayores</b> y el electrón externo está más lejos del núcleo (Z<sub>ef</sub> casi constante).", "img": "tendencias", "ex": 1, "e": 1}, {"id": "c3_2", "b": 3, "q": "¿Cómo varía el radio atómico en un periodo? Justifícalo.", "a": "<b>Disminuye hacia la derecha</b>: mismo n, pero <b>Z<sub>ef</sub> mayor</b>, así que los electrones externos están más atraídos.", "img": null, "ex": 1, "e": 1}, {"id": "c3_3", "b": 3, "q": "Ordena en orden creciente de radio: Cl, F, I, Br.", "a": "Mismo grupo (Z<sub>ef</sub> ≈ 7), distinto n: F (n = 2) &lt; Cl (3) &lt; Br (4) &lt; I (5).<br><b>F &lt; Cl &lt; Br &lt; I</b>.", "img": null, "ex": 1, "e": 1}, {"id": "c3_4", "b": 3, "q": "Ordena en orden creciente de radio: Mg, Na, P, Si, Cl.", "a": "Todos con n = 3; Z<sub>ef</sub>: Na 1, Mg 2, Si 4, P 5, Cl 7. A mayor Z<sub>ef</sub>, menor radio.<br><b>Cl &lt; P &lt; Si &lt; Mg &lt; Na</b>.", "img": null, "ex": 1, "e": 1}, {"id": "c4_0", "b": 4, "q": "¿Es un anión mayor o menor que su átomo? ¿Por qué?", "a": "<b>Mayor</b> (X⁻ &gt; X): gana electrones con la <b>misma carga nuclear</b>; aumenta la repulsión, cada electrón está menos atraído y la nube se expande.", "img": null, "ex": 1, "e": 1}, {"id": "c4_1", "b": 4, "q": "¿Es un catión mayor o menor que su átomo? ¿Por qué?", "a": "<b>Menor</b> (X⁺ &lt; X): pierde electrones con la misma carga nuclear; disminuye la repulsión y la nube se contrae. A menudo pierde además una <b>capa entera</b>.", "img": null, "ex": 1, "e": 1}, {"id": "c4_2", "b": 4, "q": "¿Quién es mayor, Na o Na⁺?", "a": "<b>Na</b>. Na: [Ne] 3s¹ (electrón externo en n = 3). Na⁺: 1s² 2s² 2p⁶ → pierde la capa n = 3 y sus 11 protones atraen solo a 10 e⁻.", "img": null, "ex": 1, "e": 1}, {"id": "c4_3", "b": 4, "q": "¿Quién es mayor, F o F⁻?", "a": "<b>F⁻</b>. Ambos tienen 9 protones, pero el F⁻ tiene 10 e⁻ (1s² 2s² 2p⁶): más repulsión con la misma carga nuclear → la nube se expande.", "img": null, "ex": 1, "e": 1}, {"id": "c4_4", "b": 4, "q": "¿Qué son especies isoelectrónicas y cómo se ordenan por tamaño?", "a": "Especies con el <b>mismo número de electrones</b> (misma configuración). Entre ellas, a <b>mayor Z, menor radio</b>: el núcleo atrae más a los mismos electrones.", "img": "isoelectronicos", "ex": 1, "e": 1}, {"id": "c4_5", "b": 4, "q": "Ordena en orden creciente de radio: Mg²⁺, F⁻, N³⁻, Al³⁺, Na⁺, O²⁻.", "a": "Todos tienen 10 e⁻; Z: Al 13, Mg 12, Na 11, F 9, O 8, N 7.<br><b>Al³⁺ &lt; Mg²⁺ &lt; Na⁺ &lt; F⁻ &lt; O²⁻ &lt; N³⁻</b>.", "img": null, "ex": 1, "e": 1}, {"id": "c4_6", "b": 4, "q": "A⁻ y B²⁺ tienen la configuración 1s² 2s² 2p⁶ 3s² 3p⁶. ¿Tienen el mismo número de protones?", "a": "<b>No</b>. Tienen los mismos electrones (18), pero A⁻ viene de un átomo con 17 (Cl, grupo 17, periodo 3) y B²⁺ de uno con 20 (Ca, grupo 2, periodo 4).", "img": null, "ex": 1, "e": 1}, {"id": "c4_7", "b": 4, "q": "¿Cómo varía el radio de los iones en un grupo y en un periodo?", "a": "En un <b>grupo</b> aumenta hacia abajo (más capas): Li⁺ &lt; Na⁺ &lt; K⁺ · F⁻ &lt; Cl⁻ &lt; Br⁻ &lt; I⁻.<br>En un <b>periodo</b>, comparando cationes entre sí o aniones entre sí, aumenta hacia la izquierda: Na⁺ &gt; Mg²⁺ &gt; Al³⁺ · N³⁻ &gt; O²⁻ &gt; F⁻.", "img": null, "ex": 0, "e": 0}, {"id": "c4_8", "b": 4, "q": "¿Es siempre un anión mayor que un catión?", "a": "<b>No</b>. Solo si son isoelectrónicos o de periodos parecidos. Si el catión tiene <b>muchas más capas</b> (n mucho mayor), puede ser mayor que el anión.", "img": null, "ex": 0, "e": 0}, {"id": "c5_0", "b": 5, "q": "Define la energía de ionización y escribe el proceso.", "a": "Energía necesaria para arrancar el <b>electrón más externo</b> de un átomo en <b>estado gaseoso</b> (kJ/mol).<br>X(g) → X⁺(g) + e⁻ ; ΔH = I &gt; 0 (<b>endotérmico</b>).", "img": null, "ex": 1, "e": 1}, {"id": "c5_1", "b": 5, "q": "¿Cómo varía la energía de ionización en un grupo y en un periodo?", "a": "Varía al <b>contrario que el radio</b>.<br>Grupo: <b>aumenta hacia arriba</b> (menor n, electrón más cerca).<br>Periodo: <b>aumenta hacia la derecha</b> (mismo n, Z<sub>ef</sub> mayor).", "img": "tendencias", "ex": 1, "e": 1}, {"id": "c5_2", "b": 5, "q": "¿Qué energía de ionización tienen los metales, los no metales y los gases nobles?", "a": "Metales: <b>baja</b> (tienden a formar cationes). No metales: <b>alta</b> (tienden a ganar electrones). Gases nobles: el <b>máximo de su periodo</b>.", "img": null, "ex": 0, "e": 1}, {"id": "c5_3", "b": 5, "q": "Ordena de mayor a menor energía de ionización: Li, Ne, K.", "a": "Li y Ne: n = 2; K: n = 4. Ne tiene Z<sub>ef</sub> ≈ 8 y Li ≈ 1; el K tiene Z<sub>ef</sub> ≈ 1 pero su electrón está en n = 4, más lejos.<br><b>Ne &gt; Li &gt; K</b>.", "img": null, "ex": 1, "e": 1}, {"id": "c5_4", "b": 5, "q": "¿Cuál tiene mayor energía de ionización, K (Z = 19) o Br (Z = 35)?", "a": "Los dos tienen el electrón externo en n = 4. K: [Ar] 4s¹, Z<sub>ef</sub> ≈ 1. Br: [Ar] 3d¹⁰ 4s² 4p⁵, Z<sub>ef</sub> ≈ 7.<br>Mismo n y mayor Z<sub>ef</sub> → <b>Br</b>.", "img": null, "ex": 1, "e": 1}, {"id": "c5_5", "b": 5, "q": "¿Cuál tiene menor energía de ionización, Si (Z = 14) o Sr (Z = 38)?", "a": "Si: [Ne] 3s² 3p², n = 3, Z<sub>ef</sub> ≈ 4. Sr: [Kr] 5s², n = 5, Z<sub>ef</sub> ≈ 2.<br>El electrón del Sr está más lejos y menos atraído → <b>Sr</b>.", "img": null, "ex": 1, "e": 0}, {"id": "c5_6", "b": 5, "q": "¿Por qué siempre I₁ &lt; I₂ &lt; I₃…?", "a": "Tras cada ionización hay la <b>misma carga nuclear</b> para <b>menos electrones</b>: los que quedan están cada vez más atraídos.", "img": "ionizacion_li", "ex": 1, "e": 1}, {"id": "c5_7", "b": 5, "q": "¿Por qué en el litio hay un salto enorme de I₁ a I₂?", "a": "Tras perder el 2s¹, el Li⁺ queda 1s² (como el He): para I₂ hay que arrancar un electrón de una <b>capa interna completa</b>, mucho más cerca del núcleo.", "img": "ionizacion_li", "ex": 1, "e": 1}, {"id": "c5_8", "b": 5, "q": "¿Cuántas energías de ionización tiene el Be? ¿Por qué I₃ ≫ I₂?", "a": "<b>Cuatro</b> (Z = 4): Be → Be⁺ → Be²⁺ → Be³⁺ → Be⁴⁺ (todas en estado gaseoso).<br>I₁ e I₂ arrancan los 2s; <b>I₃</b> arranca un electrón <b>1s</b>, de la capa interna (n = 1).", "img": null, "ex": 1, "e": 0}, {"id": "c5_9", "b": 5, "q": "¿Por qué la I₁ del oxígeno es menor que la del nitrógeno?", "a": "N (2p³) tiene la subcapa p <b>semillena</b>, muy estable. En el O (2p⁴) el electrón que se arranca está <b>apareado</b> y la <b>repulsión</b> facilita arrancarlo. Por eso I₁(N) &gt; I₁(O) aunque el O tenga mayor Z.", "img": null, "ex": 1, "e": 1}, {"id": "c5_10", "b": 5, "q": "¿Por qué la I₁ del boro es menor que la del berilio?", "a": "El electrón que pierde el B está en <b>2p</b>: más energético y más apantallado (por el 2s²) que el <b>2s</b> que pierde el Be. Por eso I₁(Be) &gt; I₁(B).", "img": null, "ex": 1, "e": 0}, {"id": "c6_0", "b": 6, "q": "Define la afinidad electrónica y escribe el proceso.", "a": "Energía <b>desprendida</b> cuando un átomo en <b>estado gaseoso</b> gana un electrón (kJ/mol).<br>X(g) + e⁻ → X⁻(g) ; ΔH = E<sub>af</sub> &lt; 0 (<b>exotérmico</b>). Ej.: Cl, −349 kJ/mol.", "img": null, "ex": 1, "e": 1}, {"id": "c6_1", "b": 6, "q": "¿Qué significa «mayor afinidad electrónica»?", "a": "Un valor <b>más negativo</b>: se desprende más energía y el átomo tiene más tendencia a captar el electrón.", "img": null, "ex": 0, "e": 1}, {"id": "c6_2", "b": 6, "q": "¿Cómo varía la afinidad electrónica?", "a": "Aumenta <b>hacia la derecha</b> y <b>hacia arriba</b>, al contrario que el radio: a menor radio y mayor Z<sub>ef</sub>, más atrae el núcleo al electrón que entra. Máxima en los halógenos; baja en los metales.", "img": "tendencias", "ex": 1, "e": 1}, {"id": "c6_3", "b": 6, "q": "Ordena de mayor a menor afinidad electrónica: Br, Cl, K, I.", "a": "Cl, Br, I: Z<sub>ef</sub> ≈ 7 y n = 3, 4, 5 → cuanto más cerca, más afinidad. K: Z<sub>ef</sub> ≈ 1 → mínima.<br><b>Cl &gt; Br &gt; I &gt; K</b>.", "img": null, "ex": 1, "e": 1}, {"id": "c6_4", "b": 6, "q": "¿Por qué el flúor tiene menor afinidad electrónica que el cloro?", "a": "El F es <b>muy pequeño</b>: el electrón que entra sufre fuertes <b>repulsiones</b> con los electrones de su capa de valencia. Por eso E<sub>af</sub>(Cl) es más negativa que la del F.", "img": null, "ex": 1, "e": 1}, {"id": "c6_5", "b": 6, "q": "¿Qué átomos tienen afinidad ≈ 0 o positiva?", "a": "<b>Gases nobles</b> (capa completa: el e⁻ iría a un nivel superior), <b>Be y Mg</b> (ns² lleno: iría a p vacía) y <b>N</b> (2p³ semilleno: obliga a aparear).", "img": null, "ex": 0, "e": 0}, {"id": "c6_6", "b": 6, "q": "¿Por qué la segunda afinidad electrónica es siempre positiva?", "a": "Hay que introducir un electrón en un ion <b>ya negativo</b>: hay que vencer la repulsión. Ej.: O⁻ + e⁻ → O²⁻, ΔH &gt; 0.", "img": null, "ex": 0, "e": 0}, {"id": "c6_7", "b": 6, "q": "Cl (Z = 17) y Ca (Z = 20): ¿cuál tiene mayor afinidad electrónica y cuál menor energía de ionización?", "a": "Cl: [Ne] 3s² 3p⁵, n = 3, Z<sub>ef</sub> ≈ 7 → <b>mayor afinidad</b>.<br>Ca: [Ar] 4s², n = 4, Z<sub>ef</sub> ≈ 2 → electrón lejano y poco atraído → <b>menor energía de ionización</b>.", "img": null, "ex": 1, "e": 0}, {"id": "c7_0", "b": 7, "q": "Define la electronegatividad.", "a": "Fuerza con la que un átomo <b>atrae el par de electrones compartido</b> en un enlace covalente. Escala de <b>Pauling</b>: <b>sin unidades</b> y relativa.", "img": null, "ex": 1, "e": 1}, {"id": "c7_1", "b": 7, "q": "¿Cómo varía la electronegatividad y qué valores extremos tiene?", "a": "Aumenta <b>hacia la derecha</b> y <b>hacia arriba</b>. El más electronegativo es el <b>F (≈ 4,0)</b>; los menos, <b>Cs y Fr (≈ 0,7)</b>.", "img": "tendencias", "ex": 1, "e": 1}, {"id": "c7_2", "b": 7, "q": "Ordena en orden creciente de electronegatividad: Br, K, F.", "a": "K: n = 4, Z<sub>ef</sub> ≈ 1. Br: n = 4, Z<sub>ef</sub> ≈ 7. F: n = 2, Z<sub>ef</sub> ≈ 7.<br><b>K &lt; Br &lt; F</b>.", "img": null, "ex": 1, "e": 1}, {"id": "c7_3", "b": 7, "q": "A (Z = 16), B (Z = 9) y C (Z = 8): ¿cuál es el menos electronegativo?", "a": "A: 1s² 2s² 2p⁶ 3s² 3p⁴ (n = 3). B: 1s² 2s² 2p⁵ y C: 1s² 2s² 2p⁴ (n = 2).<br>El electrón de valencia de A está más lejos → <b>A (azufre)</b>.", "img": null, "ex": 1, "e": 1}, {"id": "c7_4", "b": 7, "q": "¿Para qué sirve la diferencia de electronegatividad entre dos átomos?", "a": "Indica la <b>polaridad del enlace</b>: el más electronegativo queda con carga parcial <b>δ−</b> y el otro con <b>δ+</b>.", "img": null, "ex": 0, "e": 1}, {"id": "c7_5", "b": 7, "q": "Compara un metal y un no metal: energía de ionización, afinidad y tendencia.", "a": "<b>Metal</b>: I y E<sub>af</sub> muy bajas → pierde e⁻ (forma <b>cationes</b>).<br><b>No metal</b>: I y E<sub>af</sub> muy altas → gana e⁻ (forma <b>aniones</b>).", "img": null, "ex": 0, "e": 1}, {"id": "c7_6", "b": 7, "q": "Resume todas las tendencias en la tabla.", "a": "↙ <b>Radio atómico</b> aumenta hacia abajo y a la izquierda.<br>↗ <b>Energía de ionización</b>, <b>|E<sub>af</sub>|</b> y <b>electronegatividad</b> aumentan hacia arriba y a la derecha.<br>Todo se explica con <b>n</b> y <b>Z<sub>ef</sub></b>.", "img": "tendencias", "ex": 1, "e": 1}], "items": [{"id": "Br", "title": "Z = 35", "sub": "", "info": "Compáralo con: K (Z = 19)", "e": 1, "nota": "", "steps": [{"t": "Configuración electrónica", "h": "1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d¹⁰ 4p⁵<br>Abreviada: <b>[Ar] 3d¹⁰ 4s² 4p⁵</b>"}, {"t": "Periodo, grupo y bloque", "h": "<b>Periodo 4</b> · <b>grupo 17</b> (halógenos) · <b>bloque p</b> → es el <b>bromo (Br)</b>."}, {"t": "Carga nuclear efectiva", "h": "Electrones internos: 28 → Z<sub>ef</sub> ≈ 35 − 28 = <b>7</b>."}, {"t": "Ion más probable", "h": "Gana 1 e⁻ → <b>Br⁻</b> ([Ar] 3d¹⁰ 4s² 4p⁶) · valencia iónica <b>−1</b>."}, {"t": "Compara: energía de ionización", "h": "K: [Ar] 4s¹, n = 4, Z<sub>ef</sub> ≈ 1. Br: n = 4, Z<sub>ef</sub> ≈ 7.<br>Mismo n y mayor Z<sub>ef</sub> → <b>I(Br) &gt; I(K)</b>."}]}, {"id": "K", "title": "Z = 19", "sub": "", "info": "Compáralo con: Cl (Z = 17)", "e": 1, "nota": "", "steps": [{"t": "Configuración electrónica", "h": "1s² 2s² 2p⁶ 3s² 3p⁶ 4s¹<br>Abreviada: <b>[Ar] 4s¹</b>"}, {"t": "Periodo, grupo y bloque", "h": "<b>Periodo 4</b> · <b>grupo 1</b> (alcalinos) · <b>bloque s</b> → es el <b>potasio (K)</b>."}, {"t": "Carga nuclear efectiva", "h": "Electrones internos: 18 → Z<sub>ef</sub> ≈ 19 − 18 = <b>1</b>."}, {"t": "Ion más probable", "h": "Pierde 1 e⁻ → <b>K⁺</b> ([Ar]) · valencia iónica <b>+1</b>."}, {"t": "Compara: radio atómico", "h": "Cl: [Ne] 3s² 3p⁵, n = 3, Z<sub>ef</sub> ≈ 7. K: n = 4, Z<sub>ef</sub> ≈ 1.<br>Mayor n y menor Z<sub>ef</sub> → <b>r(K) &gt; r(Cl)</b>."}]}, {"id": "Ca", "title": "Z = 20", "sub": "", "info": "Compáralo con: Cl (Z = 17)", "e": 1, "nota": "", "steps": [{"t": "Configuración electrónica", "h": "1s² 2s² 2p⁶ 3s² 3p⁶ 4s²<br>Abreviada: <b>[Ar] 4s²</b>"}, {"t": "Periodo, grupo y bloque", "h": "<b>Periodo 4</b> · <b>grupo 2</b> (alcalinotérreos) · <b>bloque s</b> → es el <b>calcio (Ca)</b>."}, {"t": "Carga nuclear efectiva", "h": "Electrones internos: 18 → Z<sub>ef</sub> ≈ 20 − 18 = <b>2</b>."}, {"t": "Ion más probable", "h": "Pierde 2 e⁻ → <b>Ca²⁺</b> ([Ar]) · valencia iónica <b>+2</b>."}, {"t": "Compara: afinidad electrónica", "h": "Cl: n = 3, Z<sub>ef</sub> ≈ 7 → atrae mucho al electrón que entra. Ca: n = 4, Z<sub>ef</sub> ≈ 2.<br><b>Mayor afinidad el Cl</b>; el Ca tiende a perder electrones, no a ganarlos."}]}, {"id": "Sr", "title": "Z = 38", "sub": "", "info": "Compáralo con: Si (Z = 14)", "e": 1, "nota": "", "steps": [{"t": "Configuración electrónica", "h": "1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d¹⁰ 4p⁶ 5s²<br>Abreviada: <b>[Kr] 5s²</b>"}, {"t": "Periodo, grupo y bloque", "h": "<b>Periodo 5</b> · <b>grupo 2</b> (alcalinotérreos) · <b>bloque s</b> → es el <b>estroncio (Sr)</b>."}, {"t": "Carga nuclear efectiva", "h": "Electrones internos: 36 → Z<sub>ef</sub> ≈ 38 − 36 = <b>2</b>."}, {"t": "Ion más probable", "h": "Pierde 2 e⁻ → <b>Sr²⁺</b> ([Kr]) · valencia iónica <b>+2</b>."}, {"t": "Compara: energía de ionización", "h": "Si: [Ne] 3s² 3p², n = 3, Z<sub>ef</sub> ≈ 4. Sr: n = 5, Z<sub>ef</sub> ≈ 2.<br>Electrón más lejano y menos atraído → <b>I(Sr) &lt; I(Si)</b>."}]}, {"id": "Se", "title": "Z = 34", "sub": "", "info": "Compáralo con: Rb (Z = 37)", "e": 1, "nota": "", "steps": [{"t": "Configuración electrónica", "h": "1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d¹⁰ 4p⁴<br>Abreviada: <b>[Ar] 3d¹⁰ 4s² 4p⁴</b>"}, {"t": "Periodo, grupo y bloque", "h": "<b>Periodo 4</b> · <b>grupo 16</b> (calcógenos) · <b>bloque p</b> → es el <b>selenio (Se)</b>."}, {"t": "Carga nuclear efectiva", "h": "Electrones internos: 28 → Z<sub>ef</sub> ≈ 34 − 28 = <b>6</b>."}, {"t": "Ion más probable", "h": "Gana 2 e⁻ → <b>Se²⁻</b> ([Ar] 3d¹⁰ 4s² 4p⁶) · valencia iónica <b>−2</b>."}, {"t": "Compara: electronegatividad", "h": "Rb: [Kr] 5s¹, n = 5, Z<sub>ef</sub> ≈ 1. Se: n = 4, Z<sub>ef</sub> ≈ 6.<br>Menor n y mayor Z<sub>ef</sub> → <b>Se más electronegativo</b>."}]}, {"id": "As", "title": "Z = 33", "sub": "", "info": "Compáralo con: Ca (Z = 20)", "e": 1, "nota": "", "steps": [{"t": "Configuración electrónica", "h": "1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d¹⁰ 4p³<br>Abreviada: <b>[Ar] 3d¹⁰ 4s² 4p³</b>"}, {"t": "Periodo, grupo y bloque", "h": "<b>Periodo 4</b> · <b>grupo 15</b> (nitrogenoideos) · <b>bloque p</b> → es el <b>arsénico (As)</b>."}, {"t": "Carga nuclear efectiva", "h": "Electrones internos: 28 → Z<sub>ef</sub> ≈ 33 − 28 = <b>5</b>."}, {"t": "Ion más probable", "h": "Gana 3 e⁻ → <b>As³⁻</b> ([Ar] 3d¹⁰ 4s² 4p⁶) · valencia iónica <b>−3</b>."}, {"t": "Compara: energía de ionización", "h": "Ca: [Ar] 4s², n = 4, Z<sub>ef</sub> ≈ 2. As: n = 4, Z<sub>ef</sub> ≈ 5.<br>Mismo n y mayor Z<sub>ef</sub> → <b>I(As) &gt; I(Ca)</b>."}]}, {"id": "Rb", "title": "Z = 37", "sub": "", "info": "Compáralo con: Li (Z = 3)", "e": 1, "nota": "", "steps": [{"t": "Configuración electrónica", "h": "1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d¹⁰ 4p⁶ 5s¹<br>Abreviada: <b>[Kr] 5s¹</b>"}, {"t": "Periodo, grupo y bloque", "h": "<b>Periodo 5</b> · <b>grupo 1</b> (alcalinos) · <b>bloque s</b> → es el <b>rubidio (Rb)</b>."}, {"t": "Carga nuclear efectiva", "h": "Electrones internos: 36 → Z<sub>ef</sub> ≈ 37 − 36 = <b>1</b>."}, {"t": "Ion más probable", "h": "Pierde 1 e⁻ → <b>Rb⁺</b> ([Kr]) · valencia iónica <b>+1</b>."}, {"t": "Compara: radio atómico", "h": "Li: [He] 2s¹, n = 2, Z<sub>ef</sub> ≈ 1. Rb: n = 5, Z<sub>ef</sub> ≈ 1.<br>Misma Z<sub>ef</sub> y mayor n → <b>r(Rb) &gt; r(Li)</b>."}]}, {"id": "S", "title": "Z = 16", "sub": "", "info": "Compáralo con: F (Z = 9)", "e": 1, "nota": "", "steps": [{"t": "Configuración electrónica", "h": "1s² 2s² 2p⁶ 3s² 3p⁴<br>Abreviada: <b>[Ne] 3s² 3p⁴</b>"}, {"t": "Periodo, grupo y bloque", "h": "<b>Periodo 3</b> · <b>grupo 16</b> (calcógenos) · <b>bloque p</b> → es el <b>azufre (S)</b>."}, {"t": "Carga nuclear efectiva", "h": "Electrones internos: 10 → Z<sub>ef</sub> ≈ 16 − 10 = <b>6</b>."}, {"t": "Ion más probable", "h": "Gana 2 e⁻ → <b>S²⁻</b> ([Ar]) · valencia iónica <b>−2</b>."}, {"t": "Compara: electronegatividad", "h": "F: 1s² 2s² 2p⁵, n = 2, Z<sub>ef</sub> ≈ 7. S: n = 3, Z<sub>ef</sub> ≈ 6.<br>El F tiene menor n y mayor Z<sub>ef</sub> → <b>F más electronegativo que S</b>."}]}, {"id": "F", "title": "Z = 9", "sub": "", "info": "Compáralo con: Cl (Z = 17)", "e": 1, "nota": "Excepción frecuente en la PAU.", "steps": [{"t": "Configuración electrónica", "h": "1s² 2s² 2p⁵<br>Abreviada: <b>[He] 2s² 2p⁵</b>"}, {"t": "Periodo, grupo y bloque", "h": "<b>Periodo 2</b> · <b>grupo 17</b> (halógenos) · <b>bloque p</b> → es el <b>flúor (F)</b>."}, {"t": "Carga nuclear efectiva", "h": "Electrones internos: 2 → Z<sub>ef</sub> ≈ 9 − 2 = <b>7</b>."}, {"t": "Ion más probable", "h": "Gana 1 e⁻ → <b>F⁻</b> (1s² 2s² 2p⁶) · valencia iónica <b>−1</b>."}, {"t": "Compara: afinidad electrónica", "h": "Por tendencia, el F debería tener más afinidad, pero es <b>muy pequeño</b>: el electrón que entra sufre fuertes repulsiones.<br><b>Excepción: E<sub>af</sub>(Cl) &gt; E<sub>af</sub>(F)</b>."}]}, {"id": "Na", "title": "Z = 11", "sub": "", "info": "Compáralo con: Mg (Z = 12)", "e": 1, "nota": "", "steps": [{"t": "Configuración electrónica", "h": "1s² 2s² 2p⁶ 3s¹<br>Abreviada: <b>[Ne] 3s¹</b>"}, {"t": "Periodo, grupo y bloque", "h": "<b>Periodo 3</b> · <b>grupo 1</b> (alcalinos) · <b>bloque s</b> → es el <b>sodio (Na)</b>."}, {"t": "Carga nuclear efectiva", "h": "Electrones internos: 10 → Z<sub>ef</sub> ≈ 11 − 10 = <b>1</b>."}, {"t": "Ion más probable", "h": "Pierde 1 e⁻ → <b>Na⁺</b> ([Ne]) · valencia iónica <b>+1</b>."}, {"t": "Compara: radio atómico", "h": "Mg: [Ne] 3s², n = 3, Z<sub>ef</sub> ≈ 2. Na: n = 3, Z<sub>ef</sub> ≈ 1.<br>Mismo n y menor Z<sub>ef</sub> → <b>r(Na) &g 7</b>."}, {"t": "Ion más probable", "h": "Gana 1 e⁻ → <b>I⁻</b> ([Kr] 4d¹⁰ 5s² 5p⁶) · valencia iónica <b>−1</b>."}, {"t": "Compara: electronegatividad", "h": "F: n = 2, Z<sub>ef</sub> ≈ 7. I: n = 5, Z<sub>ef</sub> ≈ 7.<br>Misma Z<sub>ef</sub> y mayor n → <b>el F es más electronegativo que el I</b>."}]}, {"id": "Cs", "title": "Z = 55", "sub": "", "info": "Compáralo con: K (Z = 19)", "e": 1, "nota": "", "steps": [{"t": "Configuración electrónica", "h": "1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d¹⁰ 4p⁶ 5s² 4d¹⁰ 5p⁶ 6s¹<br>Abreviada: <b>[Xe] 6s¹</b>"}, {"t": "Periodo, grupo y bloque", "h": "<b>Periodo 6</b> · <b>grupo 1</b> (alcalinos) · <b>bloque s</b> → es el <b>cesio (Cs)</b>."}, {"t": "Carga nuclear efectiva", "h": "Electrones internos: 54 → Z<sub>ef</sub> ≈ 55 − 54 = <b>1</b>."}, {"t": "Ion más probable", "h": "Pierde 1 e⁻ → <b>Cs⁺</b> ([Xe]) · valencia iónica <b>+1</b>."}, {"t": "Compara: energía de ionización", "h": "K: [Ar] 4s¹, n = 4, Z<sub>ef</sub> ≈ 1. Cs: n = 6, Z<sub>ef</sub> ≈ 1.<br>Misma Z<sub>ef</sub>, electrón más lejano → <b>I(Cs) &lt; I(K)</b>."}]}, {"id": "O", "title": "Z = 8", "sub": "", "info": "Compáralo con: Na⁺ (Z = 11)", "e": 1, "nota": "", "steps": [{"t": "Configuración electrónica", "h": "1s² 2s² 2p⁴<br>Abreviada: <b>[He] 2s² 2p⁴</b>"}, {"t": "Periodo, grupo y bloque", "h": "<b>Periodo 2</b> · <b>grupo 16</b> (calcógenos) · <b>bloque p</b> → es el <b>oxígeno (O)</b>."}, {"t": "Carga nuclear efectiva", "h": "Electrones internos: 2 → Z<sub>ef</sub> ≈ 8 − 2 = <b>6</b>."}, {"t": "Ion más probable", "h": "Gana 2 e⁻ → <b>O²⁻</b> (1s² 2s² 2p⁶) · valencia iónica <b>−2</b>."}, {"t": "Compara: radio de O²⁻ y Na⁺", "h": "O²⁻ y Na⁺ son <b>isoelectrónicos</b> (10 e⁻). El Na⁺ tiene 11 protones y el O²⁻ solo 8.<br>A mayor Z, menor radio → <b>r(O²⁻) &gt; r(Na⁺)</b>."}]}, {"id": "Kr", "title": "Z = 36", "sub": "", "info": "Compáralo con: K (Z = 19)", "e": 0, "nota": "", "steps": [{"t": "Configuración electrónica", "h": "1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d¹⁰ 4p⁶<br>Abreviada: <b>[Ar] 3d¹⁰ 4s² 4p⁶</b>"}, {"t": "Periodo, grupo y bloque", "h": "<b>Periodo 4</b> · <b>grupo 18</b> (gases nobles) · <b>bloque p</b> → es el <b>kriptón (Kr)</b>."}, {"t": "Carga nuclear efectiva", "h": "Electrones internos: 28 → Z<sub>ef</sub> ≈ 36 − 28 = <b>8</b>."}, {"t": "Ion más probable", "h": "<b>No forma iones</b>: ya tiene configuración de gas noble (4s² 4p⁶)."}, {"t": "Compara: energía de ionización", "h": "K: n = 4, Z<sub>ef</sub> ≈ 1. Kr: n = 4, Z<sub>ef</sub> ≈ 8.<br>Mismo n y mucha más Z<sub>ef</sub> → <b>I(Kr) &gt; I(K)</b> (el gas noble tiene la máxima de su periodo)."}]}, {"id": "Ga", "title": "Z = 31", "sub": "", "info": "Compáralo con: Br (Z = 35)", "e": 0, "nota": "", "steps": [{"t": "Configuración electrónica", "h": "1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d¹⁰ 4p¹<br>Abreviada: <b>[Ar] 3d¹⁰ 4s² 4p¹</b>"}, {"t": "Periodo, grupo y bloque", "h": "<b>Periodo 4</b> · <b>grupo 13</b> (térreos) · <b>bloque p</b> → es el <b>galio (Ga)</b>."}, {"t": "Carga nuclear efectiva", "h": "Electrones internos: 28 → Z<sub>ef</sub> ≈ 31 − 28 = <b>3</b>."}, {"t": "Ion más probable", "h": "Pierde 3 e⁻ → <b>Ga³⁺</b> ([Ar] 3d¹⁰) · valencia iónica <b>+3</b>."}, {"t": "Compara: radio atómico", "h": "Br: n = 4, Z<sub>ef</sub> ≈ 7. Ga: n = 4, Z<sub>ef</sub> ≈ 3.<br>Mismo n y menor Z<sub>ef</sub> → <b>r(Ga) &gt; r(Br)</b>."}]}, {"id": "Ba", "title": "Z = 56", "sub": "", "info": "Compáralo con: Ca (Z = 20)", "e": 0, "nota": "", "steps": [{"t": "Configuración electrónica", "h": "1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d¹⁰ 4p⁶ 5s² 4d¹⁰ 5p⁶ 6s²<br>Abreviada: <b>[Xe] 6s²</b>"}, {"t": "Periodo, grupo y bloque", "h": "<b>Periodo 6</b> · <b>grupo 2</b> (alcalinotérreos) · <b>bloque s</b> → es el <b>bario (Ba)</b>."}, {"t": "Carga nuclear efectiva", "h": "Electrones internos: 54 → Z<sub>ef</sub> ≈ 56 − 54 = <b>2</b>."}, {"t": "Ion más probable", "h": "Pierde 2 e⁻ → <b>Ba²⁺</b> ([Xe]) · valencia iónica <b>+2</b>."}, {"t": "Compara: energía de ionización", "h": "Ca: [Ar] 4s², n = 4, Z<sub>ef</sub> ≈ 2. Ba: n = 6, Z<sub>ef</sub> ≈ 2.<br>Misma Z<sub>ef</sub>, electrón más lejano → <b>I(Ba) &lt; I(Ca)</b>."}]}], "errs": [{"id": "e0", "s": "Un catión es siempre mayor que su átomo neutro.", "v": 0, "w": "Es <b>menor</b>: pierde electrones con la misma carga nuclear y a menudo pierde una capa entera.", "e": 1}, {"id": "e1", "s": "El F⁻ es más pequeño que el F porque, al ganar un electrón, el núcleo lo atrae más.", "v": 0, "w": "Al revés: con la misma carga nuclear hay más electrones y más repulsión → <b>F⁻ &gt; F</b>.", "e": 1}, {"id": "e2", "s": "Las especies isoelectrónicas tienen el mismo radio porque tienen la misma configuración.", "v": 0, "w": "Tienen los mismos electrones pero <b>distinto Z</b>: a mayor Z, menor radio.", "e": 1}, {"id": "e3", "s": "Entre especies isoelectrónicas, la de mayor número atómico tiene el menor radio.", "v": 1, "w": "Correcto: el núcleo con más protones atrae más a los mismos electrones.", "e": 1}, {"id": "e4", "s": "Un anión es siempre mayor que cualquier catión.", "v": 0, "w": "Solo si son isoelectrónicos o de periodos parecidos; un catión con muchas más capas puede ser mayor.", "e": 1}, {"id": "e5", "s": "En un periodo el radio atómico aumenta hacia la derecha porque hay más electrones.", "v": 0, "w": "<b>Disminuye</b>: mismo n y Z<sub>ef</sub> mayor.", "e": 1}, {"id": "e6", "s": "Basta decir que el F está «arriba a la derecha» para justificar que es el más electronegativo.", "v": 0, "w": "Hay que justificar con la estructura: <b>n = 2</b> y <b>Z<sub>ef</sub> ≈ 7</b> (regla de oro).", "e": 1}, {"id": "e7", "s": "Al bajar en un grupo la Z<sub>ef</sub> es casi constante y lo que decide es el nivel n.", "v": 1, "w": "Correcto: aumenta n, el electrón externo está más lejos.", "e": 1}, {"id": "e8", "s": "La energía de ionización es una energía desprendida (ΔH &lt; 0).", "v": 0, "w": "Es <b>absorbida</b>: ΔH = I &gt; 0 (endotérmica).", "e": 1}, {"id": "e9", "s": "Para cualquier átomo se cumple I₁ &lt; I₂ &lt; I₃.", "v": 1, "w": "Correcto: la misma carga nuclear atrae cada vez a menos electrones.", "e": 1}, {"id": "e10", "s": "El oxígeno tiene mayor I₁ que el nitrógeno porque tiene más protones.", "v": 0, "w": "Es al revés: el N tiene 2p³ <b>semilleno</b> y en el O el electrón está apareado → <b>I(N) &gt; I(O)</b>.", "e": 1}, {"id": "e11", "s": "El boro tiene mayor I₁ que el berilio porque está más a la derecha.", "v": 0, "w": "Excepción: el B pierde un electrón <b>2p</b>, más energético y apantallado → <b>I(Be) &gt; I(B)</b>.", "e": 0}, {"id": "e12", "s": "El cloro tiene mayor afinidad electrónica que el flúor.", "v": 1, "w": "Correcto: el F es tan pequeño que el electrón que entra sufre fuertes repulsiones.", "e": 1}, {"id": "e13", "s": "«Mayor afinidad electrónica» significa un valor más positivo.", "v": 0, "w": "Significa un valor <b>más negativo</b>: se desprende más energía.", "e": 1}, {"id": "e14", "s": "La segunda afinidad electrónica del oxígeno (O⁻ + e⁻ → O²⁻) es negativa.", "v": 0, "w": "Es <b>positiva</b>: hay que vencer la repulsión del ion ya negativo.", "e": 0}, {"id": "e15", "s": "La electronegatividad se mide en kJ/mol.", "v": 0, "w": "Es <b>adimensional</b> (escala de Pauling).", "e": 1}, {"id": "e16", "s": "El elemento más electronegativo es el flúor.", "v": 1, "w": "Correcto: F ≈ 4,0 en la escala de Pauling.", "e": 1}, {"id": "e17", "s": "Los gases nobles tienen la energía de ionización mínima de su periodo.", "v": 0, "w": "Tienen la <b>máxima</b> de su periodo.", "e": 1}, {"id": "e18", "s": "Moseley demostró que la tabla se ordena por la masa atómica.", "v": 0, "w": "Demostró que se ordena por el <b>número atómico Z</b>.", "e": 1}, {"id": "e19", "s": "Mendeléiev dejó huecos en su tabla y predijo el eka-silicio, que resultó ser el germanio.", "v": 1, "w": "Correcto.", "e": 0}, {"id": "e20", "s": "En el bloque p, el grupo es igual al número de electrones en np.", "v": 0, "w": "Grupo = <b>12 + e⁻ en np</b> (Br, 4p⁵ → grupo 17).", "e": 1}, {"id": "e21", "s": "El periodo de un elemento es su número de electrones de valencia.", "v": 0, "w": "El periodo es el <b>nivel n más alto ocupado</b>.", "e": 1}, {"id": "e22", "s": "Los metales tienen energías de ionización bajas y tienden a formar cationes.", "v": 1, "w": "Correcto: pierden fácilmente sus electrones de valencia.", "e": 1}, {"id": "e23", "s": "El Cr tiene configuración [Ar] 4s² 3d⁴.", "v": 0, "w": "Es una excepción: <b>[Ar] 4s¹ 3d⁵</b> (subcapa d semillena, más estable).", "e": 0}, {"id": "e24", "s": "A⁻ y B²⁺ con la misma configuración electrónica tienen el mismo número de protones.", "v": 0, "w": "Tienen los mismos <b>electrones</b>, pero distinto Z (p. ej. Cl⁻ y Ca²⁺).", "e": 1}, {"id": "e25", "s": "El Na⁺ es mucho menor que el Na sobre todo porque pierde la capa n = 3.", "v": 1, "w": "Correcto: Na⁺ queda 1s² 2s² 2p⁶; además, 11 protones atraen a 10 electrones.", "e": 1}]};
const M2=DATA.meta.modo2; const K=DATA.meta.clave;
const $=s=>document.querySelector(s);
const st={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let mode='c', easy=st.get(K+'_easy',false), sessLen=st.get(K+'_len',10), blk=st.get(K+'_blk','all');
let queue=[], cur=null, phase=0, stats={ok:0,ko:0};
const KEY={c:K+'_box_c',m:K+'_box_m',e:K+'_box_e'};
function boxes(m){return st.get(KEY[m],{})}
function setBox(m,id,v){const b=boxes(m);b[id]=v;st.set(KEY[m],b)}
function pool(m){
  let p = m==='c'?DATA.cards:(m==='m'?DATA.items:DATA.errs);
  if(m==='c'&&blk!=='all') p=p.filter(x=>String(x.b)===String(blk));
  if(easy) p=p.filter(x=>x.e);
  return p;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(){
  const b=boxes(mode); const p=shuffle(pool(mode).slice());
  p.sort((x,y)=>(b[x.id]||1)-(b[y.id]||1));
  queue = sessLen? p.slice(0,sessLen):p;
  stats={ok:0,ko:0}; next();
}
function next(){cur=queue.shift()||null; phase=0; render()}
function answer(ok){
  const b=boxes(mode); const v=b[cur.id]||1;
  if(ok){setBox(mode,cur.id,Math.min(5,v+1)); stats.ok++}
  else{setBox(mode,cur.id,1); stats.ko++; queue.splice(Math.min(3,queue.length),0,cur)}
  next();
}
function progress(){
  const p=pool(mode), b=boxes(mode); const cnt=[0,0,0,0,0];
  p.forEach(x=>cnt[(b[x.id]||1)-1]++);
  const cols=['#FDECEA','#FFF3CD','#FFF8E1','#E8F5E9','#C8E6C9'];
  const tc=['#B71C1C','#7a5a00','#8a6d00','#2E7D32','#1B5E20'];
  const mast=cnt[3]+cnt[4];
  $('#prog').innerHTML=`<b>${mast} de ${p.length}</b> tarjetas dominadas · en esta sesión: ✔ ${stats.ok} · ✘ ${stats.ko} · quedan ${queue.length+(cur?1:0)}
   <div class="boxes">${cnt.map((c,i)=>`<div style="background:${cols[i]};color:${tc[i]}" title="Caja ${i+1}">${c}</div>`).join('')}</div>
   <div class="lbl"><span>Caja 1 · por aprender</span><span>Caja 5 · dominadas</span></div>`;
}
function chips(x){
  let h=''; if(mode==='c') h+=`<span class="chip">${DATA.blocks[x.b]}</span>`;
  if(x.ex) h+='<span class="chip ex">★ Pregunta de examen</span>';
  if(mode==='m') h+=`<span class="chip ex">${M2.chip}</span>`;
  return h?`<div class="chips">${h}</div>`:'';
}
function img(n,alt){return n?`<img src="img/${n}.jpg" alt="${alt}" loading="lazy">`:''}
function doneView(){
  return `<div class="card done"><div class="big">🎉</div><p><b>¡Sesión terminada!</b><br>Aciertos: ${stats.ok} · Fallos: ${stats.ko}</p>
  <p class="hint">Las tarjetas que fallas vuelven a salir pronto; las que dominas, más tarde.</p>
  <div class="btns"><button class="btn show" id="again">Otra sesión</button></div></div>`;
}
function render(){
  document.body.classList.toggle('easy',easy);
  $('#bar').style.display = mode==='h'?'none':'flex';
  $('#prog').style.display = mode==='h'?'none':'block';
  $('#blk').style.display = mode==='c'?'':'none';
  const v=$('#view');
  if(mode==='h'){v.innerHTML=HELP();return}
  progress();
  if(!cur){v.innerHTML=doneView(); $('#again').onclick=build; return}
  if(mode==='c'){
    v.innerHTML=`<article class="card">${chips(cur)}<div class="q">${cur.q}</div>
     ${phase? `<div class="a">${cur.a}${img(cur.img,'Ilustración')}</div>
       <div class="btns"><button class="btn no" id="no">✘ No lo sabía</button><button class="btn si" id="si">✔ Lo sabía</button></div>`
     : `<p class="hint">Piensa la respuesta (o dila en voz alta) y después dale la vuelta.</p><div class="btns"><button class="btn show" id="flip">Ver respuesta</button></div>`}
    </article>`;
  } else if(mode==='m'){
    const S=cur.steps.map(x=>[x.t,x.h,x.img||null]); const NS=S.length;
    v.innerHTML=`<article class="card">${chips(cur)}<div class="mf">${cur.title}</div><div class="mn">${cur.sub||''}</div><div class="mz">${cur.info||''}</div>
     <div class="task">${M2.tarea}</div>
     ${S.map((s,i)=>`<div class="step ${i<phase?'':'locked'}"><h3><span class="n">${i+1}</span>${s[0]}</h3>${i<phase?`<div class="c">${s[1]}${s[2]?img(s[2],s[0]+' de '+cur.f):''}</div>`:''}</div>`).join('')}
     ${phase>=NS && cur.nota? `<div class="note">💡 ${cur.nota}</div>`:''}
     <div class="btns">${phase<NS? `<button class="btn show" id="flip">Destapar paso ${phase+1}</button>${phase<NS-1?'<button class="btn ghost" id="all">Ver todo</button>':''}`
       : `<button class="btn no" id="no">✘ Me equivoqué</button><button class="btn si" id="si">✔ Lo hice bien</button>`}</div></article>`;
  } else {
    v.innerHTML=`<article class="card">${chips(cur)}<div class="hint" style="margin-top:0">¿Verdadero o falso?</div><div class="vf">«${cur.s}»</div>
     ${phase? `<div class="fb ${phase===1?'ok':'ko'}"><b class="t">${phase===1?'✔ ¡Correcto!':'✘ No'} · Es ${cur.v?'VERDADERO':'FALSO'}</b>${cur.w}</div>
        <div class="btns"><button class="btn show" id="cont">Siguiente</button></div>`
      : `<div class="btns"><button class="btn si" id="vt">Verdadero</button><button class="btn no" id="vf">Falso</button></div>`}</article>`;
  }
  const on=(id,f)=>{const e=document.getElementById(id); if(e) e.onclick=f};
  on('flip',()=>{phase++;render()});
  on('all',()=>{phase=(cur.steps?cur.steps.length:5);render()});
  on('si',()=>answer(true)); on('no',()=>answer(false));
  on('vt',()=>{phase=(cur.v?1:2);render()}); on('vf',()=>{phase=(cur.v?2:1);render()});
  on('cont',()=>answer(phase===1));
}
const HELP=()=>`<div class="card help">
<h2>¿Cómo funcionan?</h2>
<p>Cada tarjeta tiene una <b>pregunta</b>. Intenta responderla de memoria <b>antes</b> de darle la vuelta. Después sé sincero:</p>
<ul><li><b>✔ Lo sabía</b>: la tarjeta sube de caja y tardará más en volver.</li><li><b>✘ No lo sabía</b>: vuelve a la caja 1 y te saldrá otra vez enseguida.</li></ul>
<p>Las cajas van de la 1 (por aprender) a la 5 (dominadas). Cada sesión empieza por las que peor llevas. Tu progreso se guarda en este dispositivo.</p>
<h2>Los tres modos</h2>
<ul><li><b>Conceptos</b>: la teoría del tema en preguntas cortas. Las marcadas con <b>★ Pregunta de examen</b> son las que suelen caer.</li>
<li><b>${M2.titulo}</b>: ${M2.ayuda}</li>
<li><b>Errores típicos</b>: frases de verdadero o falso con los fallos que más restan puntos.</li></ul>
<h2>Consejos</h2>
<ul><li>Mejor <b>10 minutos cada día</b> que una hora el día antes del examen.</li><li>Di la respuesta en voz alta o escríbela: así se recuerda mejor.</li>
<li><b>Lectura fácil</b> pone letra más grande y espaciada y deja solo las tarjetas esenciales.</li></ul>
<div class="btns"><button class="btn ghost" id="reset">Borrar mi progreso</button></div></div>`;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));
  mode=b.dataset.m; if(mode==='h'){render(); const r=document.getElementById('reset'); if(r) r.onclick=()=>{if(confirmReset()){Object.values(KEY).forEach(k=>st.set(k,{})); r.textContent='Progreso borrado'}}; return} build();
});
function confirmReset(){const r=document.getElementById('reset'); if(r.dataset.c){return true} r.dataset.c=1; r.textContent='Pulsa otra vez para confirmar'; return false}
const sel=$('#blk'); sel.innerHTML='<option value="all">Todos los bloques</option>'+DATA.blocks.map((b,i)=>`<option value="${i}">${i+1}. ${b}</option>`).join('');
sel.value=blk; sel.onchange=()=>{blk=sel.value; st.set(K+'_blk',blk); build()};
$('#len').value=String(sessLen); $('#len').onchange=e=>{sessLen=+e.target.value; st.set(K+'_len',sessLen); build()};
$('#easy').checked=easy; $('#easy').onchange=e=>{easy=e.target.checked; st.set(K+'_easy',easy); build()};
build();
</script>
</body>
</html>
